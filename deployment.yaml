apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic
spec:
  replicas: 2
  selector:
    matchLabels:
      app: petclinic
  template:
    metadata:
      labels:
        app: petclinic
    spec:
      containers:
      - name: petclinic
        image: 703800905711.dkr.ecr.us-east-1.amazonaws.com/petclinic:55
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
